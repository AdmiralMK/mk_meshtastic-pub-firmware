[env:mk_esp32s3_n16r8_e22_30s]
board_level = extra
extends = esp32s3_base
board = my-esp32s3-diy-oled
board_build.arduino.memory_type = dio_opi
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
upload_protocol = esptool
;upload_port = /dev/ttyACM0
upload_speed = 921600
; КРИТИЧЕСКИ ВАЖНО для 16MB флеш-памяти, чтобы настройки сохранялись после перезагрузки!
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

custom_meshtastic_hw_model = 35
custom_meshtastic_hw_model_slug = GENIEBLOCKS
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Admiral DIY
custom_meshtastic_images = muzi_r1_neo.svg
custom_meshtastic_tags = GenieBlocks

build_flags = 
  ${esp32s3_base.build_flags}
  -D GENIEBLOCKS
  -I variants/esp32s3/diy/mk_esp32s3_n16r8_e22_30s
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -UARDUINO_USB_CDC_ON_BOOT    ; un-define if it was set somewhere
  -DSERIAL_OVERRIDE=Serial0    ; force Serial to be Serial0
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D OLED_RU
  -DRADIOLIB_EXCLUDE_SX127X=1       ; Исключает SX1276, SX1278, SX1279 (устаревшие LoRa чипы)
  -DRADIOLIB_EXCLUDE_SX128X=1       ; Исключает SX1280, SX1281, SX1282 (LoRa чипы на 2.4 ГГц)
  -DRADIOLIB_EXCLUDE_LR11X0=1       ; Исключает семейство LR1110, LR1120, LR1121 (чипы с геолокацией)
  -DRADIOLIB_EXCLUDE_LLCC68=1       ; Исключает LLCC68 (урезанная версия SX1262 без части функций)
  -DRADIOLIB_EXCLUDE_STM32WLX=1     ; Исключает встроенный радиомодуль микроконтроллеров STM32WL
  -D MAX_NUM_NODES=500
  -D BOOT_WELCOME_MARKDOWN=1        ; Для новых Android-приложений (markdown: **жирный**, *курсив*) либо ...=0

  ; ==========================================
  ; 1. Включение модуля управления трафиком (TMM)
  ; ==========================================
  ; Жесткое включение модуля TMM на уровне компиляции
  -D USERPREFS_MODULE_TRAFFIC_MANAGEMENT_HAS_TRAFFIC_MANAGEMENT=1
  -D HAS_TRAFFIC_MANAGEMENT=1
  ; Применение правил к приватным каналам
  -D USERPREFS_TMM_APPLY_TO_PRIVATE_CHANNELS=1
  ; (Опционально) Включение прямого ответа NodeInfo для роутеров
  ; -D USERPREFS_MODULE_TRAFFIC_MANAGEMENT_NODEINFO_DIRECT_RESPONSE_MAX_HOPS=3

  ; ==========================================
  ; 2. Настройка каналов
  ; ==========================================
  ; ВНИМАНИЕ: 1 первичный (индекс 0) + 3 дополнительных (индексы 1, 2, 3) = 4 канала всего!
  -D USERPREFS_CHANNELS_TO_WRITE=2

  ; --- Канал 0: Primary (MediumFast) ---
  ; ВНИМАНИЕ: Этот канал обязателен, чтобы индексы 1, 2 и 3 встали на свои места!
  -D USERPREFS_CHANNEL_0_NAME='"MediumFast"'
  -D USERPREFS_CHANNEL_0_PSK='{ 0x01 }'  ; 0x01 = стандартный открытый ключ Meshtastic (AQ==)
  -D USERPREFS_CHANNEL_0_UPLINK_ENABLED=0
  -D USERPREFS_CHANNEL_0_DOWNLINK_ENABLED=0
  -D USERPREFS_CHANNEL_0_PRECISION=0    ; Стандартная точность для публичного канала (или 0)
 
  ; --- Канал 1: ADMBOT (Ключ 'xxxxxxxxxxxxxxxxxxxx=') (32-байтный AES-256 ключ) ---
  -D USERPREFS_CHANNEL_1_NAME='"ADMBOT"'
  -D USERPREFS_CHANNEL_1_PSK='{ 0x01 }'
  -D USERPREFS_CHANNEL_1_UPLINK_ENABLED=0
  -D USERPREFS_CHANNEL_1_DOWNLINK_ENABLED=0
  -D USERPREFS_CHANNEL_1_PRECISION=0

  ; ; --- Канал 1: UFA (Ключ UQ== -> ровно 1 байт 0x51) ---
  ; -D USERPREFS_CHANNEL_1_NAME='"UFA"'
  ; -D USERPREFS_CHANNEL_1_PSK='{ 0x51 }'
  ; -D USERPREFS_CHANNEL_1_UPLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_1_DOWNLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_1_PRECISION=0

  ; ; --- Канал 2: FLOOD (Ключ FQ== -> ровно 1 байт 0x15) ---
  ; -D USERPREFS_CHANNEL_2_NAME='"FLOOD"'
  ; -D USERPREFS_CHANNEL_2_PSK='{ 0x15 }'
  ; -D USERPREFS_CHANNEL_2_UPLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_2_DOWNLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_2_PRECISION=0

  ; ; --- Канал 3: NEWS (Ключ NQ== -> ровно 1 байт 0x35). Работает только при доработке модуля Channels.cpp ---
  ; -D USERPREFS_CHANNEL_3_NAME='"NEWS"'
  ; -D USERPREFS_CHANNEL_3_PSK='{ 0x35 }'
  ; -D USERPREFS_CHANNEL_3_UPLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_3_DOWNLINK_ENABLED=0
  ; -D USERPREFS_CHANNEL_3_PRECISION=0

  ; ==========================================
  ; Настройки GPS и позиционирования
  ; ==========================================
  ; Полное отключение GPS (аппаратно отсутствует или программно игнорируется)
  -D USERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_NOT_PRESENT
  ; Отключение "умного" позиционирования (отправка только при значительном изменении координат)
  -D USERPREFS_CONFIG_SMART_POSITION_ENABLED=0
  ; Установка часового пояса (обратите внимание на одинарные кавычки вокруг двойных для корректной передачи строки в C++)
  -D USERPREFS_TZ_STRING='"GMT-5"'

  ; ==========================================
  ; Настройки радио LoRa
  ; ==========================================
  ; Установка региона на Россию (RU)
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_RU
  ; Установка пресета модуляции на MEDIUM_FAST (баланс скорости и дальности)
  -D USERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_MEDIUM_FAST
  ; Установка конкретного частотного слота (канала) внутри региона
  -D USERPREFS_LORACONFIG_CHANNEL_NUM=1

  ; Отключение прослушивания входящих маяков (0 = false / выключено)
  -D USERPREFS_MESH_BEACON_LISTEN_ENABLED=0
  ; Отключение отправки (вещания) собственных маяков
  -D USERPREFS_MESH_BEACON_BROADCAST_ENABLED=0

  ; Публичный ключ администратора (32 байта) "e567" public key "88370wCV/n5R1Kbno6P4s38ehdHso/yT/hYcWcp0PQM="
  -D USERPREFS_USE_ADMIN_KEY_0="{ 0xF3, 0xCD, 0xFB, 0xD3, 0x00, 0x95, 0xFE, 0x7E, 0x51, 0xD4, 0xA6, 0xE7, 0xA3, 0xA3, 0xF8, 0xB3, 0x7F, 0x1E, 0x85, 0xD1, 0xEC, 0xA3, 0xFC, 0x93, 0xFE, 0x16, 0x1C, 0x59, 0xCA, 0x74, 0x3D, 0x03 }"
  ; Публичный ключ администратора (32 байта) "COFE" public key "YWWQKZ+Lvc8ZU9DWrXWCmiybEfarAhnN2oB4KW7RCBY="
  -D USERPREFS_USE_ADMIN_KEY_1="{ 0x61, 0x65, 0x90, 0x29, 0x9F, 0x8B, 0xBD, 0xCF, 0x19, 0x53, 0xD0, 0xD6, 0xAD, 0x75, 0x82, 0x9A, 0x2C, 0x9B, 0x11, 0xF6, 0xAB, 0x02, 0x19, 0xCD, 0xDA, 0x80, 0x78, 0x29, 0x6E, 0xD1, 0x08, 0x16 }"

  ; Публичный ключ администратора (32 байта) "KILO" public key "SHc8w7cDoJfGxG3e0NtdKp9VSgVK9kWLh8HemSNNyWk="
  ;-D USERPREFS_USE_ADMIN_KEY_0="{ 0x48, 0x77, 0x3C, 0xC3, 0xB7, 0x03, 0xA0, 0x97, 0xC6, 0xC4, 0x6D, 0xDE, 0xD0, 0xDB, 0x5D, 0x2A, 0x9F, 0x55, 0x4A, 0x05, 0x4A, 0xF6, 0x45, 0x8B, 0x87, 0xC1, 0xDE, 0x99, 0x23, 0x4D, 0xC9, 0x69 }"
  ; Публичный ключ администратора (32 байта) "ZULU" public key "gqHJBcnMwPSDX5YFTuP2Wf+ncFWYbVWcyiQs7pmKHyY="
  ;-D USERPREFS_USE_ADMIN_KEY_1="{ 0x82, 0xA1, 0xC9, 0x05, 0xC9, 0xCC, 0xC0, 0xF4, 0x83, 0x5F, 0x96, 0x05, 0x4E, 0xE3, 0xF6, 0x59, 0xFF, 0xA7, 0x70, 0x55, 0x98, 0x6D, 0x55, 0x9C, 0xCA, 0x24, 0x2C, 0xEE, 0x99, 0x8A, 0x1F, 0x26 }"


  ; Эта команда создаст каналы и сразу сохранит его в память ноды
  ; python -m meshtastic --ch-index 3 --ch-set name '"NEWS"' --ch-set psk 0x35 --ch-set uplink_enabled false --ch-set downlink_enabled false --ch-set position_precision 0
  ; python -m meshtastic --ch-index 4 --ch-set name '"ADMBOT"' --ch-set psk 0x55 --ch-set uplink_enabled false --ch-set downlink_enabled false --ch-set position_precision 0
  ; python -m meshtastic --set position.position_flags 0
  ; python -m meshtastic --reboot